<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Stereo serial number methods</title><desc id="desc">Illustration showing the Honda Acura 1 plus 6 plus power method and the physical serial label on the stereo chassis</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".32"/></filter></defs><rect width="1200" height="800" rx="50" fill="url(#bg)"/><circle cx="1040" cy="100" r="260" fill="#2563eb" opacity=".12"/><circle cx="120" cy="720" r="260" fill="#38bdf8" opacity=".07"/><g transform="translate(75 95)" filter="url(#shadow)"><rect width="500" height="600" rx="34" fill="#0f172a" stroke="#334155" stroke-width="4"/><text x="250" y="65" text-anchor="middle" fill="#93c5fd" font-size="23" font-family="Arial,sans-serif" font-weight="800">HONDA / ACURA</text><rect x="70" y="110" width="360" height="255" rx="25" fill="#111827" stroke="#475569" stroke-width="4"/><rect x="115" y="145" width="270" height="90" rx="14" fill="url(#screen)"/><text x="250" y="183" text-anchor="middle" fill="#93c5fd" font-size="18" font-family="Arial,sans-serif" font-weight="700">SERIAL NUMBER</text><text x="250" y="217" text-anchor="middle" fill="#fff" font-size="27" font-family="Arial,sans-serif" font-weight="900">U1234  L5678</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="115" y="275" width="65" height="48" rx="10" fill="#1e293b" stroke="#64748b"/><text x="147" y="307" fill="#fff" font-size="22" font-weight="900">1</text><rect x="195" y="275" width="65" height="48" rx="10" fill="#1e293b" stroke="#64748b"/><text x="227" y="307" fill="#fff" font-size="22" font-weight="900">2</text><rect x="275"