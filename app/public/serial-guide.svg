ht="235" rx="16" fill="#475569"/><g stroke="#64748b" stroke-width="3"><path d="M60 55v185M95 55v185M265 55v185M300 55v185"/><path d="M45 80h270M45 215h270"/></g><rect x="120" y="90" width="150" height="105" rx="8" fill="#fff"/><text x="137" y="120" fill="#64748b" font-size="13" font-family="Arial,sans-serif" font-weight="800">SERIAL NO.</text><text x="137" y="151" fill="#0f172a" font-size="20" font-family="Arial,sans-serif" font-weight="900">SN 30009030</text><g fill="#0f172a"><rect x="137" y="165" width="3" height="18"/><rect x="144" y="165" width="2" height="18"/><rect x="150" y="165" width="4" height="18"/><rect x="159" y="165" width="2" height="18"/><rect x="166" y="165" width="5" height="18"/><rect x="176" y="165" width="2" height="18"/><rect x="182" y="165" width="3" height="18"/><rect x="190" y="165" width="5" height="18"/><rect x="200" y="165" width="2" height="18"/><rect x="207" y="165" width="4" height="18"/><rect x="216" y="165" width="2" height="18"/><rect x="223" y="165" width="5" height="18"/></g></g><path d="M250 445v55" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><path d="m235 487 15 18 15-18" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="95" y="520" width="310" height="50" rx="15" fill="#dbeafe"/><text x="250" y="552" text-anchor="middle" fill="#1e3a8a" font-size="18" font-family="Arial,sans-serif" font-weight="900">TOP • SIDE • REAR / ATRÁS</text></g></svg>