name: TJSDATES Mobile

on:
  push:
    paths:
      - 'tjsdates-mobile/**'
      - '.github/workflows/tjsdates-mobile-check.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tjsdates-mobile

jobs:
  android:
    name: Android · APK de prueba y AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:android
      - run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
        working-directory: tjsdates-mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tjsdates-android-builds
          path: |
            tjsdates-mobile/android/app/build/outputs/apk/debug/app-debug.apk
            tjsdates-mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS · Compilación para simulador
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:ios
      - run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/tjsdates-ios" \
            CODE_SIGNING_ALLOWED=NO build
